databases:
  - name: monopass-db
    databaseName: monopass
    user: monopass

services:
  - type: web
    name: core-api
    runtime: node
    buildCommand: npm install --include=optional && npm run prisma:generate -w core-api && npm run build -w core-api
    startCommand: npm run prisma:migrate -w core-api && npm run start -w core-api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: monopass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PRICING_EVENT
        value: "750"
      - key: PRICING_BASE
        value: "2999"
      - key: PRICING_PRO
        value: "5000"
      - key: PRICING_CURRENCY
        value: MXN
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: APP_LOGIN_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: LANDING_PUBLIC_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: LANDING_PUBLIC_RATE_LIMIT_MAX
        value: "60"

  - type: web
    name: scanner-service
    runtime: node
    buildCommand: npm install --include=optional && npm run prisma:generate -w scanner-service && npm run build -w scanner-service
    startCommand: npm run start -w scanner-service
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: monopass-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: core-api
          envVarKey: JWT_SECRET
      - key: CORE_API_BASE_URL
        sync: false
      - key: SCANNER_API_KEY
        generateValue: true

  - type: web
    name: monopass-frontend
    runtime: static
    buildCommand: npm install --include=optional && npm run build -w frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_CORE_API_BASE_URL
        sync: false
      - key: VITE_SCANNER_API_BASE_URL
        sync: false
      - key: VITE_DISABLE_MOTION
        value: "false"
      - key: VITE_RP_MOCK
        value: "false"

  - type: web
    name: monopass-landing
    runtime: static
    buildCommand: npm install --include=optional && npm run build -w landing
    staticPublishPath: ./landing/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_CORE_API_BASE_URL
        sync: false
      - key: VITE_LANDING_MOCK_BACKEND
        value: "false"
